name: Gatekeeper CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run typecheck
      - run: npm run build

  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: gatekeeper_test
          POSTGRES_USER: gatekeeper
          POSTGRES_PASSWORD: gatekeeper
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U gatekeeper -d gatekeeper_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      GATEKEEPER_ENVIRONMENT: test
      GATEKEEPER_DATABASE_URL: postgresql+psycopg://gatekeeper:gatekeeper@localhost:5432/gatekeeper_test
      GATEKEEPER_API_KEY_PEPPER: ci-only-test-pepper-not-a-production-secret
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13.5"
          cache: pip
      - run: pip install -r requirements.lock
      - run: pip install -e . --no-deps
      - run: ruff check backend alembic scripts
      - run: mypy backend scripts
      - run: alembic upgrade head
      - run: alembic check
      - run: python -m scripts.build_benchmark_expansion
      - run: python -m scripts.verify_benchmark
      - run: pytest --cov=backend/app --cov-report=term-missing
